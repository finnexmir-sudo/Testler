<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Test platforması</title>
<link rel="stylesheet" href="assets/base.css?v=32">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px}
  .box{max-width:420px;width:100%}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .brand .mark{width:30px;height:30px;border-radius:8px;flex:0 0 30px;
    background:linear-gradient(140deg,var(--brand) 0%,var(--teal) 100%);
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-size:13px;font-weight:700;letter-spacing:-.02em}
  .brand span{font-size:15px;font-weight:600;letter-spacing:-.012em}
  h1{font-size:24px;letter-spacing:-.024em;margin:0 0 7px}
  .lead{color:var(--fg-2);font-size:14.5px;line-height:1.55;margin:0 0 24px}
  a.nav{display:flex;align-items:center;gap:13px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;
    margin-bottom:10px;text-decoration:none;color:inherit;
    transition:border-color .12s,background .12s}
  a.nav:hover{border-color:var(--n-400);background:var(--n-25)}
  a.nav .ic{width:34px;height:34px;flex:0 0 34px;border-radius:9px;
    background:var(--brand-tint);color:var(--brand);
    display:flex;align-items:center;justify-content:center}
  a.nav .ic svg{width:17px;height:17px;stroke-width:1.75}
  a.nav .g{flex:1;min-width:0}
  a.nav b{display:block;font-size:14.5px;font-weight:570;letter-spacing:-.008em}
  a.nav i{display:block;font-style:normal;font-size:12.5px;color:var(--fg-2);margin-top:3px}
  a.nav .arrow{color:var(--n-300);display:flex}
  a.nav .arrow svg{width:16px;height:16px;stroke-width:2}
  a.nav.soon{opacity:.6;pointer-events:none}
  a.nav.soon .ic{background:var(--n-100);color:var(--n-400)}
  .foot{color:var(--fg-3);font-size:12.5px;margin-top:22px;text-align:center}
</style>
</head>
<body>
  <div class="box">
    <div class="brand"><span class="mark">T</span><span>Test platforması</span></div>

    <h1>İbtidai siniflər üçün onlayn testlər</h1>
    <p class="lead">Müəllim qrup yaradır, şagirdə giriş kodu verir.
      Nəticələr avtomatik yığılır.</p>

    <a class="nav" href="muellim/">
      <span class="ic"><svg viewBox="0 0 19 19" fill="none" stroke="currentColor"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 15.5a3.5 3.5 0 0 0-7 0"/><circle cx="9.5" cy="8" r="2.4"/>
        <path d="M15.5 14.5a3 3 0 0 0-2.2-2.9"/><path d="M13.2 6.2a2.2 2.2 0 0 1 0 4.2"/>
      </svg></span>
      <span class="g"><b>Müəllim / repetitor paneli</b>
        <i>Qrup yarat, şagird əlavə et, giriş kodu ver</i></span>
      <span class="arrow"><svg viewBox="0 0 19 19" fill="none" stroke="currentColor"
        stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/>
      </svg></span>
    </a>

    <a class="nav" href="sagird/">
      <span class="ic"><svg viewBox="0 0 19 19" fill="none" stroke="currentColor"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="6.5" cy="12.5" r="3"/><path d="M8.7 10.3 15.5 3.5"/><path d="M13 6l2 2"/>
      </svg></span>
      <span class="g"><b>Şagird girişi</b><i>Müəllimin verdiyi kodla daxil ol</i></span>
      <span class="arrow"><svg viewBox="0 0 19 19" fill="none" stroke="currentColor"
        stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/>
      </svg></span>
    </a>

    <p class="foot">Hazırlıq mərhələsindədir.</p>
  </div>
</body>
</html>
